name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify release and build assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check version tag and extension files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check -- --tag "$RELEASE_TAG"
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create or refresh GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Attach tested release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$current_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::The release tag moved while these assets were being built."
            exit 1
          fi
          if immutable="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isImmutable --jq .isImmutable)"; then
            if [[ "$immutable" == 'true' ]]; then
              echo "::error::This release is immutable. Publish a new version instead."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
              --repo "$GH_REPO" --verify-tag --draft --generate-notes \
              --title "Invert colors $RELEASE_TAG"
          fi
