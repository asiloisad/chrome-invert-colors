<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Invert colors integration fixture</title>
<style>
  html { background: white; color: black; }
  body { margin: 20px; font: 16px system-ui; }
  .row { display: flex; align-items: start; gap: 12px; margin-bottom: 12px; }
  img, video, canvas, svg, .background { display: block; width: 64px; height: 64px; }
  .background { background-image: url('/swatch.svg'); }
  #author { filter: opacity(.8); }
  #author-important { filter: sepia(.3) !important; }
  #author-live { filter: brightness(.8); }
  #author-parent { filter: opacity(.9); }
  .desaturated { filter: grayscale(.4); }
  #background-pseudo::before { content: 'label'; }
  iframe { width: 300px; height: 160px; border: 0; }
  #text-swatch { width: 64px; height: 64px; background: rgb(20, 100, 220); }
  .transition-gallery { display: flex; gap: 12px; content-visibility: auto; contain-intrinsic-size: auto 64px; }
  .transition-gallery img { transition: all 150ms linear; }
  .transition-gallery .author-dimmed { filter: brightness(.5); }
  .transition-gallery .author-contrasted { filter: contrast(.5); }
</style>
<body>
<div class="row">
  <img id="image" src="/swatch.svg" alt="blue fixture">
  <video id="video" poster="/swatch.svg"></video>
  <canvas id="canvas" width="64" height="64"></canvas>
  <svg id="svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" fill="rgb(20,100,220)"/></svg>
  <div id="background" class="background"></div>
  <div id="background-text" class="background">label</div>
  <div id="background-pseudo" class="background"></div>
  <div id="background-parent" class="background"><img id="background-inner" src="/swatch.svg" alt="child on background"></div>
  <div id="text-swatch"></div>
</div>
<div class="row">
  <div class="logo"><img id="nested" src="/swatch.svg" alt="nested logo"></div>
  <img id="author" src="/swatch.svg" alt="author filter">
  <img id="author-important" src="/swatch.svg" alt="important author filter">
  <img id="author-live" src="/swatch.svg" alt="changing author filter">
  <img id="author-class" src="/swatch.svg" alt="changing class filter">
  <div id="author-parent"><img id="author-child" src="/swatch.svg" alt="filtered ancestor"></div>
  <div id="shadow-host"></div>
  <div id="late-shadow-host"></div>
</div>
<iframe id="same-frame" title="same origin" src="/frame.html"></iframe>
<iframe id="cross-frame" title="other origin"></iframe>
<script>
  const paint = canvas => {
    canvas.getContext('2d').fillStyle = 'rgb(20, 100, 220)';
    canvas.getContext('2d').fillRect(0, 0, 64, 64);
  };
  paint(document.querySelector('#canvas'));
  document.querySelector('#shadow-host').attachShadow({ mode: 'open' }).innerHTML =
    '<style>img { display:block; width:64px; height:64px }</style><img id="shadow-image" src="/swatch.svg">';
  const cross = new URL('/frame.html?cross', location.href);
  cross.hostname = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
  document.querySelector('#cross-frame').src = cross.href;
  window.addFixtures = () => {
    const img = document.createElement('img');
    img.id = 'dynamic-image'; img.src = '/swatch.svg'; document.body.append(img);
    const host = document.createElement('div'); host.id = 'dynamic-shadow'; document.body.append(host);
    host.attachShadow({ mode: 'open' }).innerHTML = '<img id="dynamic-shadow-image" src="/swatch.svg" width="64" height="64">';
    const frame = document.createElement('iframe'); frame.id = 'dynamic-frame'; frame.src = '/frame.html?dynamic'; document.body.append(frame);
    const srcdoc = document.createElement('iframe'); srcdoc.id = 'srcdoc-frame';
    srcdoc.srcdoc = '<!doctype html><html><body style="margin:0"><img id="srcdoc-image" width="64" height="64" src="' + location.origin + '/swatch.svg"></body></html>';
    document.body.append(srcdoc);
  };
  window.addTransitionFixtures = () => {
    const top = document.createElement('section');
    top.className = 'transition-gallery';
    top.innerHTML = '<img id="transition-top" src="/swatch.svg" alt="top transitioning image"><img id="transition-top-author" class="author-dimmed" src="/swatch.svg" alt="top author-filtered transitioning image">';
    top.querySelector('#transition-top').style.setProperty('transition', 'filter 150ms linear', 'important');
    document.body.prepend(top);
    const spacer = document.createElement('div');
    spacer.style.height = '1800px';
    const bottom = document.createElement('section');
    bottom.className = 'transition-gallery';
    bottom.innerHTML = '<img id="transition-bottom" src="/swatch.svg" loading="lazy" alt="bottom transitioning image"><img id="transition-bottom-author" src="/swatch.svg" loading="lazy" alt="bottom author-filtered transitioning image">';
    const author = bottom.querySelector('#transition-bottom-author');
    author.style.setProperty('filter', 'brightness(.5)', 'important');
    author.style.setProperty('transition-property', 'opacity, filter', 'important');
    author.style.setProperty('transition-duration', '5s, 150ms', 'important');
    author.style.setProperty('transition-timing-function', 'linear', 'important');
    author.style.setProperty('transition-delay', '0s', 'important');
    document.body.append(spacer, bottom);
    const properties = ['filter', 'transition', 'transition-property', 'transition-duration', 'transition-timing-function', 'transition-delay', 'transition-behavior'];
    return Object.fromEntries([...top.children, ...bottom.children].map(node => [node.id,
      Object.fromEntries(properties.map(property => [property, {
        value: node.style.getPropertyValue(property), priority: node.style.getPropertyPriority(property),
      }]))]));
  };
  window.addPreviewFixtures = () => {
    const gallery = document.createElement('section');
    gallery.className = 'row';
    gallery.id = 'preview-gallery';
    const thumbnail = document.createElement('img');
    thumbnail.id = 'preview-thumbnail';
    thumbnail.src = '/swatch.svg?thumbnail';
    thumbnail.alt = 'thumbnail copied into enlarged previews';
    thumbnail.style.setProperty('filter', 'brightness(.5)', 'important');
    thumbnail.style.setProperty('transition', 'filter 150ms linear', 'important');
    const authorInvert = document.createElement('img');
    authorInvert.id = 'preview-author-invert';
    authorInvert.src = '/swatch.svg?author-invert';
    authorInvert.alt = 'legitimate author inversion';
    authorInvert.style.setProperty('filter', 'brightness(.5) invert(1)', 'important');
    authorInvert.style.setProperty('transition', 'filter 150ms linear', 'important');
    authorInvert.style.setProperty('--invert-colors-filter-state-v1', 'author-owned');
    const authorVariable = document.createElement('img');
    authorVariable.id = 'preview-author-variable';
    authorVariable.src = '/swatch.svg?author-variable';
    authorVariable.alt = 'author filter referencing an existing custom property';
    authorVariable.style.setProperty('--invert-colors-filter-state-v1', 'invert(1)', 'important');
    authorVariable.style.setProperty('filter', 'brightness(.5) var(--invert-colors-filter-state-v1)', 'important');
    authorVariable.style.setProperty('transition', 'filter 150ms linear', 'important');
    gallery.append(thumbnail, authorInvert, authorVariable);
    document.body.prepend(gallery);
    const properties = ['filter', 'transition', 'transition-property', 'transition-duration', 'transition-timing-function', 'transition-delay', 'transition-behavior', '--invert-colors-filter-state-v1'];
    const snapshot = node => Object.fromEntries(properties.map(property => [property, {
      value: node.style.getPropertyValue(property), priority: node.style.getPropertyPriority(property),
    }]));
    return { thumbnail: snapshot(thumbnail), authorInvert: snapshot(authorInvert), authorVariable: snapshot(authorVariable) };
  };
  window.openDelayedPreview = () => new Promise(resolve => setTimeout(() => {
    const preview = document.createElement('img');
    preview.id = 'preview-live';
    preview.src = '/swatch.svg?preview-placeholder';
    preview.alt = 'delayed enlarged image preview';
    preview.style.setProperty('filter', 'brightness(.5)', 'important');
    preview.style.setProperty('transition', 'filter 150ms linear', 'important');
    document.querySelector('#preview-gallery').append(preview);
    resolve();
  }, 150));
  window.copyPreviewThumbnail = () => {
    const source = document.querySelector('#preview-thumbnail');
    const clone = source.cloneNode(true);
    clone.id = 'preview-clone';
    clone.src = '/swatch.svg?cloned-full-image';
    const styleCopy = document.createElement('img');
    styleCopy.id = 'preview-style-copy';
    styleCopy.src = '/swatch.svg?style-copied-full-image';
    styleCopy.alt = 'new preview with copied thumbnail style';
    styleCopy.style.cssText = source.style.cssText;
    document.querySelector('#preview-gallery').append(clone, styleCopy);
  };
</script>
</body>
</html>
